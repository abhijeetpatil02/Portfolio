<!-- Contact Section -->
<section id="contact" class="section animate-on-scroll fade-up">
    <div class="container">
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-wrapper glass">
            <div class="contact-info">
                <h3>Let's Connect</h3>
                <p>I'm currently open for new opportunities and collaborations. Whether you have a question or just want to say hi, I'll try my best to get back to you!</p>

                <div class="social-links">
                    <a href="https://www.linkedin.com/in/abhijeet-patil-83696837a/" target="_blank" class="social-icon" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://github.com/abhijeetpatil02" target="_blank" class="social-icon" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="https://www.codechef.com/users/abhijeet_p02" target="_blank" class="social-icon" aria-label="CodeChef"><i class="fas fa-code"></i></a>
                    <a href="mailto:patilabhijeet261@gmail.com" class="social-icon" aria-label="Email"><i class="fas fa-envelope"></i></a>
                </div>
            </div>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Your Name" required>
                    <label for="name">Name</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Your Email" required>
                    <label for="email">Email</label>
                </div>
                <div class="form-group">
                    <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                    <label for="message">Message</label>
                </div>
                <button type="submit" class="btn btn-primary submit-btn">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>
</section>
